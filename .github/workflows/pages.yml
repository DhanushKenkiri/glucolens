name: Test and deploy to GitHub Pages

# Every push to main runs the Go and frontend checks, builds the static site
# (the Go API and ADK agent compiled to WebAssembly, plus the React app) and
# publishes it to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Backend tests
        run: go vet ./... && go test ./...
        working-directory: backend

      - name: Frontend type check, lint and tests
        run: npx tsc -b && npx eslint . && npm test
        working-directory: frontend

      - name: Build the static site
        run: node scripts/build-pages.mjs --base "/${{ github.event.repository.name }}/"

      - name: Publish to the gh-pages branch
        working-directory: frontend/dist-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
