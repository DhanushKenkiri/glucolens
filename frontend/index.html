<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GlucoLens helps you understand your checkup results by comparing them with 100,000 anonymised checkups." />
    <title>GlucoLens</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var pref = 'system'
        try {
          var raw = localStorage.getItem('glucolens-settings')
          if (raw) pref = (JSON.parse(raw).state || {}).theme || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
